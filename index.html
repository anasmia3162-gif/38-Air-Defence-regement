<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazari - Online Shopping</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* Header Navbar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #0d6efd; color: white; padding: 10px 20px; border-radius: 6px; }
    .brand-title { font-size: 20px; font-weight: bold; }
    .nav-links { display: flex; gap: 15px; }
    .nav-links a { color: white; text-decoration: none; font-size: 14px; }
    
    /* Admin Auth Controls (Hidden by Default) */
    .admin-controls { display: none; margin-top: 15px; justify-content: flex-end; gap: 10px; }
    .admin-controls.show { display: flex; }
    .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-admin { background-color: #e0e0e0; color: #333; }
    .btn-user { background-color: #d1e7dd; color: #0f5132; }
    .btn-logout { background-color: #dc3545; color: #fff; }
    .btn-submit { background-color: #0d6efd; color: #fff; width: 100%; padding: 10px; font-size: 16px; margin-top: 15px; border-radius: 6px; cursor: pointer; }

    /* Admin Form Section */
    .admin-section { display: none; margin-top: 20px; }
    .admin-section.show { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; margin-bottom: 5px; color: #666; }
    .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

    /* Product Table */
    table { width: 100%; border-collapse: collapse; margin-top: 25px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
    th { background-color: #f8f9fa; color: #555; }
    .product-img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
    
    /* Price Styling */
    .original-price { text-decoration: line-through; color: #888; font-size: 13px; margin-right: 6px; }
    .discount-price { font-weight: bold; color: #28a745; font-size: 15px; }
    .badge-discount { background: #dc3545; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 5px; }

    .btn-delete { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Brand Navbar -->
  <div class="top-bar">
    <div class="brand-title">Bazari</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Track Order</a>
    </div>
  </div>

  <!-- Admin Controls (ইউজার সাইটে লুকানো থাকবে) -->
  <div id="adminControls" class="admin-controls">
    <button class="btn btn-admin">Admin Mode</button>
    <button class="btn btn-user">User Site</button>
    <button class="btn btn-logout">Logout</button>
  </div>

  <!-- Admin Panel Input Form (ইউজার সাইটে লুকানো থাকবে) -->
  <div id="adminSection" class="admin-section">
    <h3>Add New Product</h3>
    <form id="addProductForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="prodName" placeholder="e.g. Wireless Headphones" required>
        </div>
        <div class="form-group">
          <label>Regular Price (৳)</label>
          <input type="number" id="prodPrice" placeholder="e.g. 1200" required>
        </div>
        <div class="form-group">
          <label>Discount (%)</label>
          <input type="number" id="prodDiscount" placeholder="e.g. 10 (Optional)" min="0" max="100">
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="prodStock" placeholder="e.g. 50" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="prodCategory">
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Groceries">Groceries</option>
          </select>
        </div>
        <div class="form-group">
          <label>Product Image (From Gallery/Device)</label>
          <input type="file" id="prodImage" accept="image/*" required>
        </div>
      </div>
      <button type="submit" class="btn btn-submit">Add Product</button>
    </form>
  </div>

  <!-- Product List Table -->
  <table>
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th class="admin-only-col" style="display:none;">Action</th>
      </tr>
    </thead>
    <tbody id="productTableBody">
      <!-- Default Items -->
      <tr>
        <td><img src="https://via.placeholder.com/45" class="product-img" alt="Product"></td>
        <td>Wireless Headphones</td>
        <td>Electronics</td>
        <td>
          <span class="original-price">৳1200</span>
          <span class="discount-price">৳1080</span>
          <span class="badge-discount">-10%</span>
        </td>
        <td>14</td>
        <td class="admin-only-col" style="display:none;"><button class="btn-delete" onclick="deleteRow(this)">🗑️</button></td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  // 1. Admin Panel URL / Secret Toggle System
  function checkAdminAccess() {
    // URL-এ #admin থাকলে এডমিন প্যানেল দেখাবে (যেমন: site.com/#admin)
    const isAdmin = window.location.hash === '#admin';
    
    const adminControls = document.getElementById('adminControls');
    const adminSection = document.getElementById('adminSection');
    const adminCols = document.querySelectorAll('.admin-only-col');

    if (isAdmin) {
      adminControls.classList.add('show');
      adminSection.classList.add('show');
      adminCols.forEach(col => col.style.display = 'table-cell');
    } else {
      adminControls.classList.remove('show');
      adminSection.classList.remove('show');
      adminCols.forEach(col => col.style.display = 'none');
    }
  }

  // URL Change Listeners
  window.addEventListener('load', checkAdminAccess);
  window.addEventListener('hashchange', checkAdminAccess);

  // Shortcut key (Ctrl + Shift + A) দিয়ে গোপন এডমিন টগল
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'A') {
      if (window.location.hash === '#admin') {
        window.location.hash = '';
      } else {
        window.location.hash = '#admin';
      }
    }
  });

  // 2. Add Product Logic with Gallery Image & Discount Calculation
  document.getElementById('addProductForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('prodName').value;
    const originalPrice = parseFloat(document.getElementById('prodPrice').value);
    const discountPercent = parseFloat(document.getElementById('prodDiscount').value) || 0;
    const stock = document.getElementById('prodStock').value;
    const category = document.getElementById('prodCategory').value;
    const imageInput = document.getElementById('prodImage');

    if (imageInput.files && imageInput.files[0]) {
      const reader = new FileReader();

      reader.onload = function(e) {
        const imageUrl = e.target.result; // গ্যালারি বা ফাইল থেকে পড়া ছবি
        
        // ডিসকাউন্ট প্রসেস
        let priceHTML = '';
        if (discountPercent > 0) {
          const newPrice = originalPrice - (originalPrice * (discountPercent / 100));
          priceHTML = `
            <span class="original-price">৳${originalPrice}</span>
            <span class="discount-price">৳${Math.round(newPrice)}</span>
            <span class="badge-discount">-${discountPercent}%</span>
          `;
        } else {
          priceHTML = `<span class="discount-price">৳${originalPrice}</span>`;
        }

        // টেবিলে ডাটা যুক্ত করা
        const tbody = document.getElementById('productTableBody');
        const newRow = document.createElement('tr');

        newRow.innerHTML = `
          <td><img src="${imageUrl}" class="product-img"></td>
          <td>${name}</td>
          <td>${category}</td>
          <td>${priceHTML}</td>
          <td>${stock}</td>
          <td class="admin-only-col"><button class="btn-delete" onclick="deleteRow(this)">🗑️</button></td>
        `;

        tbody.appendChild(newRow);
        document.getElementById('addProductForm').reset();
        checkAdminAccess(); // রিলোড ছাড়াই এডমিন কলাম ভিউ মেইনটেইন করবে
      };

      reader.readAsDataURL(imageInput.files[0]);
    }
  });

  function deleteRow(btn) {
    btn.closest('tr').remove();
  }
</script>

</body>
</html>
