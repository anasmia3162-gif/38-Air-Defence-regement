<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazari - অনলাইন শপিং</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { border-bottom: 2px solid #4f46e5; color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div onclick="switchPanel('user')" class="flex items-center space-x-2 cursor-pointer">
                <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-store text-xl"></i></div>
                <span class="text-2xl font-black text-indigo-600 tracking-tight">Bazari</span>
            </div>

            <div id="user-nav" class="flex items-center space-x-4">
                <button onclick="openCart()" class="relative p-2 text-slate-700 hover:text-indigo-600">
                    <i class="fa-solid fa-bag-shopping text-2xl"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
                <button onclick="loginAdmin()" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-lg font-medium hover:bg-slate-800 transition">
                    <i class="fa-solid fa-user-gear mr-1"></i> এডমিন
                </button>
            </div>

            <div id="admin-nav" class="hidden flex items-center space-x-3">
                <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full border border-amber-300">এডমিন মোড</span>
                <button onclick="switchPanel('user')" class="bg-slate-200 text-slate-700 text-sm px-3 py-1.5 rounded-lg font-medium hover:bg-slate-300">ইউজার সাইট</button>
                <button onclick="logoutAdmin()" class="bg-rose-600 text-white text-sm px-3 py-1.5 rounded-lg font-medium hover:bg-rose-700">লগআউট</button>
            </div>
        </div>
    </header>

    <!-- USER PANEL -->
    <main id="user-panel" class="max-w-7xl mx-auto px-4 py-6">
        <!-- Banner Slider -->
        <div id="banner-container" onmouseenter="stopAutoSlide()" onmouseleave="startAutoSlide()" class="relative bg-slate-200 rounded-2xl overflow-hidden mb-8 h-48 md:h-80 shadow-inner">
            <div id="banner-slider" class="w-full h-full relative"></div>
            <button onclick="changeBanner(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 w-9 h-9 rounded-full shadow flex items-center justify-center z-10"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="changeBanner(1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 w-9 h-9 rounded-full shadow flex items-center justify-center z-10"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- Categories Filter -->
        <div class="mb-6">
            <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">ক্যাটাগরি</h3>
            <div id="user-category-list" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Products -->
        <h2 class="text-xl font-bold mb-4 text-slate-900">পণ্যসমূহ</h2>
        <div id="user-product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <!-- ADMIN PANEL -->
    <main id="admin-panel" class="hidden max-w-7xl mx-auto px-4 py-6">
        <div class="flex border-b border-slate-200 mb-6 gap-6">
            <button onclick="switchAdminTab('products')" id="tab-btn-products" class="pb-3 font-semibold text-slate-600 active-tab">প্রোডাক্ট ও স্টক</button>
            <button onclick="switchAdminTab('categories')" id="tab-btn-categories" class="pb-3 font-semibold text-slate-600">ক্যাটাগরি ম্যানেজমেন্ট</button>
            <button onclick="switchAdminTab('banners')" id="tab-btn-banners" class="pb-3 font-semibold text-slate-600">ব্যানার ম্যানেজমেন্ট</button>
        </div>

        <!-- Products Tab -->
        <section id="admin-tab-products" class="space-y-6">
            <div class="bg-white p-5 rounded-xl border shadow-sm">
                <h3 class="font-bold text-lg mb-4">নতুন প্রোডাক্ট যোগ করুন</h3>
                <form onsubmit="handleAddProduct(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="p-name" placeholder="প্রোডাক্টের নাম" required class="border p-2.5 rounded-lg text-sm w-full">
                    <input type="number" id="p-price" placeholder="মূল্য (৳)" required class="border p-2.5 rounded-lg text-sm w-full">
                    <input type="number" id="p-stock" placeholder="স্টক সংখ্যা" required class="border p-2.5 rounded-lg text-sm w-full">
                    <select id="p-category" required class="border p-2.5 rounded-lg text-sm w-full"></select>
                    <input type="url" id="p-image" placeholder="ইমেজ URL (যেমন: https://...)" required class="border p-2.5 rounded-lg text-sm w-full md:col-span-2">
                    <button type="submit" class="bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition md:col-span-3">প্রোডাক্ট যুক্ত করুন</button>
                </form>
            </div>

            <div class="bg-white rounded-xl border shadow-sm overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 border-b text-slate-600">
                        <tr>
                            <th class="p-3">ছবি</th>
                            <th class="p-3">নাম</th>
                            <th class="p-3">ক্যাটাগরি</th>
                            <th class="p-3">মূল্য</th>
                            <th class="p-3">স্টক</th>
                            <th class="p-3 text-right">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-table"></tbody>
                </table>
            </div>
        </section>

        <!-- Categories Tab -->
        <section id="admin-tab-categories" class="hidden space-y-6">
            <div class="bg-white p-5 rounded-xl border shadow-sm max-w-md">
                <h3 class="font-bold text-lg mb-4">নতুন ক্যাটাগরি যোগ করুন</h3>
                <form onsubmit="handleAddCategory(event)" class="flex gap-2">
                    <input type="text" id="cat-name" placeholder="ক্যাটাগরির নাম" required class="border p-2.5 rounded-lg text-sm flex-1">
                    <button type="submit" class="bg-indigo-600 text-white text-sm font-medium px-4 py-2.5 rounded-lg hover:bg-indigo-700">যোগ করুন</button>
                </form>
            </div>
            <div class="bg-white rounded-xl border shadow-sm max-w-md p-4">
                <ul id="admin-category-list" class="divide-y"></ul>
            </div>
        </section>

        <!-- Banners Tab -->
        <section id="admin-tab-banners" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-xl border shadow-sm max-w-2xl">
                <h3 class="font-bold text-lg mb-2">হোমপেজ ব্যানার সেট করুন (সর্বোচ্চ ৫টি)</h3>
                <div id="banner-inputs" class="space-y-4"></div>
            </div>
        </section>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 bg-black/40 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col justify-between overflow-y-auto">
            <div>
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="font-bold text-lg">আপনার শপিং কার্ট</h3>
                    <button onclick="closeCart()" class="text-slate-400 hover:text-slate-700 text-2xl">&times;</button>
                </div>
                
                <div id="cart-items" class="p-4 divide-y"></div>

                <div id="checkout-form-container" class="p-4 bg-slate-50 border-t space-y-3 hidden">
                    <h4 class="font-bold text-sm text-slate-700">ডেলিভারি তথ্য দিন:</h4>
                    <input type="text" id="cust-name" placeholder="আপনার নাম" class="w-full border p-2 text-sm rounded-lg">
                    <input type="tel" id="cust-phone" placeholder="মোবাইল নম্বর" class="w-full border p-2 text-sm rounded-lg">
                    <textarea id="cust-address" placeholder="পূর্ণাঙ্গ ঠিকানা" class="w-full border p-2 text-sm rounded-lg" rows="2"></textarea>
                </div>
            </div>

            <div class="p-4 border-t bg-slate-50 space-y-3">
                <div class="flex justify-between font-bold text-lg">
                    <span>মোট:</span>
                    <span id="cart-total">৳০</span>
                </div>
                <button id="checkout-btn" onclick="showCheckoutForm()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">
                    অর্ডার নিশ্চিত করুন
                </button>
                <button id="submit-order-btn" onclick="submitOrder()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition hidden">
                    অর্ডার প্লেস করুন
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initial Data
        const defaultCategories = ["সব", "ইলেকট্রনিক্স", "ফ্যাশন", "হোম অ্যাপ্লায়েন্স"];
        const defaultProducts = [
            { id: 1, name: "ওয়্যারলেস হেডফোন", price: 1200, stock: 15, category: "ইলেকট্রনিক্স", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
            { id: 2, name: "কজুয়াল টি-শার্ট", price: 450, stock: 8, category: "ফ্যাশন", image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" }
        ];
        const defaultBanners = [
            "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200",
            "https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=1200",
            "", "", ""
        ];

        let categories = defaultCategories;
        let products = defaultProducts;
        let banners = defaultBanners;

        // Load LocalStorage Safety
        try {
            const savedCats = localStorage.getItem('bazari_cats');
            if (savedCats) categories = JSON.parse(savedCats);

            const savedProds = localStorage.getItem('bazari_prods');
            if (savedProds) products = JSON.parse(savedProds);

            const savedBanners = localStorage.getItem('bazari_banners');
            if (savedBanners) banners = JSON.parse(savedBanners);
        } catch(e) {
            console.warn("LocalStorage storage error or disabled", e);
        }

        let activeBannerIndex = 0;
        let autoSlideTimer = null;
        let selectedCategory = "সব";
        let cart = [];

        function saveData() {
            try {
                localStorage.setItem('bazari_cats', JSON.stringify(categories));
                localStorage.setItem('bazari_prods', JSON.stringify(products));
                localStorage.setItem('bazari_banners', JSON.stringify(banners));
            } catch(e) {
                console.warn("Data could not be saved to LocalStorage", e);
            }
        }

        function init() {
            renderBanners();
            startAutoSlide();
            renderCategories();
            renderProducts();
            populateCategoryDropdown();
            renderBannerInputs();
        }

        function switchPanel(panel) {
            if (panel === 'admin') {
                document.getElementById('user-panel').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('user-nav').classList.add('hidden');
                document.getElementById('admin-nav').classList.remove('hidden');
                renderAdminProducts();
                renderAdminCategories();
            } else {
                document.getElementById('user-panel').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
                document.getElementById('user-nav').classList.remove('hidden');
                document.getElementById('admin-nav').classList.add('hidden');
                renderProducts();
            }
        }

        function loginAdmin() {
            const pass = prompt("Bazari এডমিন পাসওয়ার্ড দিন (ডিফল্ট: admin)");
            if (pass === "admin") {
                switchPanel('admin');
            } else if (pass !== null) {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function logoutAdmin() { switchPanel('user'); }

        function renderBanners() {
            const activeBanners = banners.filter(b => b && b.trim() !== "");
            const container = document.getElementById('banner-slider');
            if (activeBanners.length === 0) {
                container.innerHTML = `<div class="w-full h-full bg-slate-300 flex items-center justify-center text-slate-600 font-medium">কোনো ব্যানার যুক্ত নেই</div>`;
                return;
            }
            if (activeBannerIndex >= activeBanners.length) activeBannerIndex = 0;
            container.innerHTML = `<img src="${activeBanners[activeBannerIndex]}" class="w-full h-full object-cover transition-all duration-500">`;
        }

        function changeBanner(step) {
            const activeBanners = banners.filter(b => b && b.trim() !== "");
            if (activeBanners.length <= 1) return;
            activeBannerIndex = (activeBannerIndex + step + activeBanners.length) % activeBanners.length;
            renderBanners();
        }

        function startAutoSlide() {
            stopAutoSlide();
            autoSlideTimer = setInterval(() => { changeBanner(1); }, 3000);
        }

        function stopAutoSlide() {
            if (autoSlideTimer) clearInterval(autoSlideTimer);
        }

        function renderBannerInputs() {
            const container = document.getElementById('banner-inputs');
            container.innerHTML = "";
            for (let i = 0; i < 5; i++) {
                container.innerHTML += `
                    <div class="border p-3 rounded-lg bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-bold text-slate-700 mb-1">ব্যানার ${i + 1}</label>
                            <input type="file" accept="image/*" onchange="handleBannerUpload(event, ${i})" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                        ${banners[i] ? `
                            <div class="flex items-center space-x-2">
                                <img src="${banners[i]}" class="h-12 w-20 rounded object-cover border">
                                <button onclick="removeBanner(${i})" class="text-rose-500 hover:text-rose-700 text-xs font-bold px-2 py-1 bg-rose-50 rounded border border-rose-200">মুছুন</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
        }

        function handleBannerUpload(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                    canvas.height = (img.width > MAX_WIDTH) ? img.height * scale : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    banners[index] = canvas.toDataURL('image/jpeg', 0.6);
                    saveData();
                    renderBanners();
                    renderBannerInputs();
                };
            };
            reader.readAsDataURL(file);
        }

        function removeBanner(index) {
            banners[index] = "";
            saveData();
            renderBanners();
            renderBannerInputs();
        }

        function renderCategories() {
            const container = document.getElementById('user-category-list');
            container.innerHTML = "";
            categories.forEach(cat => {
                const active = cat === selectedCategory ? "bg-indigo-600 text-white" : "bg-white text-slate-700 hover:bg-slate-100 border";
                container.innerHTML += `<button onclick="filterCategory('${cat}')" class="px-4 py-1.5 rounded-full text-sm font-medium transition ${active}">${cat}</button>`;
            });
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderProducts();
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('p-category');
            select.innerHTML = '<option value="">ক্যাটাগরি নির্বাচন করুন</option>';
            categories.filter(c => c !== "সব").forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function handleAddCategory(e) {
            e.preventDefault();
            const val = document.getElementById('cat-name').value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                document.getElementById('cat-name').value = "";
                saveData();
                renderCategories();
                populateCategoryDropdown();
                renderAdminCategories();
            }
        }

        function renderAdminCategories() {
            const list = document.getElementById('admin-category-list');
            list.innerHTML = "";
            categories.filter(c => c !== "সব").forEach((c) => {
                list.innerHTML += `
                    <li class="py-2.5 flex justify-between items-center text-sm">
                        <span>${c}</span>
                        <button onclick="deleteCategory('${c}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                    </li>
                `;
            });
        }

        function deleteCategory(cat) {
            categories = categories.filter(c => c !== cat);
            saveData();
            renderCategories();
            populateCategoryDropdown();
            renderAdminCategories();
        }

        function renderProducts() {
            const grid = document.getElementById('user-product-grid');
            grid.innerHTML = "";
            const filtered = selectedCategory === "সব" ? products : products.filter(p => p.category === selectedCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-slate-400 text-center py-10">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>`;
                return;
            }

            filtered.forEach(p => {
                const stockBadge = p.stock > 0 ? `<span class="text-emerald-600 font-medium">স্টক: ${p.stock}</span>` : `<span class="text-rose-500 font-medium">স্টক আউট</span>`;
                grid.innerHTML += `
                    <div class="bg-white rounded-xl border overflow-hidden flex flex-col justify-between shadow-sm hover:shadow-md transition">
                        <div>
                            <img src="${p.image}" class="w-full h-36 md:h-44 object-cover" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                            <div class="p-3">
                                <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${p.category}</span>
                                <h4 class="font-bold text-slate-800 text-sm mt-1 line-clamp-1">${p.name}</h4>
                                <div class="flex justify-between items-center mt-2 text-xs">
                                    <span class="text-indigo-600 font-black text-sm">৳${p.price}</span>
                                    ${stockBadge}
                                </div>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="addToCart(${p.id})" ${p.stock === 0 ? 'disabled' : ''} class="w-full bg-indigo-600 disabled:bg-slate-300 text-white text-xs font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">
                                ${p.stock > 0 ? 'কার্টে যোগ করুন' : 'স্টক নেই'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const newProd = {
                id: Date.now(),
                name: document.getElementById('p-name').value,
                price: Number(document.getElementById('p-price').value),
                stock: Number(document.getElementById('p-stock').value),
                category: document.getElementById('p-category').value,
                image: document.getElementById('p-image').value
            };
            products.push(newProd);
            saveData();
            e.target.reset();
            renderAdminProducts();
            alert("প্রোডাক্ট সফলভাবে যুক্ত হয়েছে!");
        }

        function renderAdminProducts() {
            const table = document.getElementById('admin-product-table');
            table.innerHTML = "";
            products.forEach(p => {
                table.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-3"><img src="${p.image}" class="w-10 h-10 rounded object-cover" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td class="p-3 font-medium">${p.name}</td>
                        <td class="p-3 text-slate-500">${p.category}</td>
                        <td class="p-3 font-semibold">৳${p.price}</td>
                        <td class="p-3">${p.stock}টি</td>
                        <td class="p-3 text-right">
                            <button onclick="deleteProduct(${p.id})" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            saveData();
            renderAdminProducts();
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if (!prod || prod.stock <= 0) return;

            const existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.qty < prod.stock) {
                    existing.qty++;
                } else {
                    alert("স্টক সীমার বেশি যোগ করা যাবে না!");
                    return;
                }
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-badge').innerText = totalQty;
            
            const container = document.getElementById('cart-items');
            container.innerHTML = "";
            let totalPrice = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-6 text-sm">কার্ট ফাঁকা রয়েছে</p>`;
                resetCheckoutForm();
            } else {
                cart.forEach(item => {
                    const itemTotal = item.price * item.qty;
                    totalPrice += itemTotal;
                    container.innerHTML += `
                        <div class="py-3 flex justify-between items-center">
                            <div>
                                <h5 class="font-bold text-sm">${item.name}</h5>
                                <span class="text-xs text-slate-500">৳${item.price} x ${item.qty}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-sm">৳${itemTotal}</span>
                                <button onclick="removeFromCart(${item.id})" class="text-rose-500 text-xs p-1">&times;</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('cart-total').innerText = `৳${totalPrice}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function openCart() { document.getElementById('cart-drawer').classList.remove('hidden'); }
        function closeCart() { 
            document.getElementById('cart-drawer').classList.add('hidden');
            resetCheckoutForm();
        }

        function showCheckoutForm() {
            if (cart.length === 0) return alert("আপনার কার্ট খালি!");
            document.getElementById('checkout-form-container').classList.remove('hidden');
            document.getElementById('checkout-btn').classList.add('hidden');
            document.getElementById('submit-order-btn').classList.remove('hidden');
        }

        function resetCheckoutForm() {
            document.getElementById('checkout-form-container').classList.add('hidden');
            document.getElementById('checkout-btn').classList.remove('hidden');
            document.getElementById('submit-order-btn').classList.add('hidden');
        }

        function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert("অনুগ্রহ করে আপনার নাম, ফোন নম্বর এবং ঠিকানা সঠিকভাবে লিখুন।");
                return;
            }

            cart.forEach(item => {
                const prod = products.find(p => p.id === item.id);
                if (prod) prod.stock -= item.qty;
            });

            saveData();
            alert(`ধন্যবাদ ${name}! আপনার অর্ডার সফলভাবে গ্রহণ করা হয়েছে।`);
            cart = [];
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-phone').value = '';
            document.getElementById('cust-address').value = '';
            
            updateCartUI();
            closeCart();
            renderProducts();
        }

        function switchAdminTab(tab) {
            ['products', 'categories', 'banners'].forEach(t => {
                document.getElementById(`admin-tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).classList.remove('active-tab');
            });
            document.getElementById(`admin-tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).classList.add('active-tab');
        }

        window.onload = init;
    </script>
</body>
</html>
