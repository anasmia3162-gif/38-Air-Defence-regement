<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustRoute Express - Courier Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold text-yellow-400 text-2xl fa-truck-fast"></i>
                <span class="text-2xl font-bold tracking-wide">Trust<span class="text-yellow-400">Route</span></span>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <button onclick="switchTab('tracking')" class="hover:text-yellow-400">ট্র্যাকিং</button>
                <button onclick="switchTab('calculator')" class="hover:text-yellow-400">ক্যালকুলেটর</button>
                <button onclick="switchTab('pickup')" class="hover:text-yellow-400">পিকআপ</button>
                <button onclick="switchTab('merchant')" class="hover:text-yellow-400">মার্চেন্ট প্যানেল</button>
                <button onclick="switchTab('rider')" class="hover:text-yellow-400">রাইডার প্যানেল</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- 1. PARCEL TRACKING SECTION -->
        <section id="tracking" class="tab-content active">
            <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center"><i class="fa-solid fa-magnifying-glass text-blue-800 mr-2"></i>পার্সেল ট্র্যাকিং (Parcel Tracking)</h2>
                <div class="flex gap-2 mb-6">
                    <input type="text" id="trackInput" placeholder="ট্র্যাকিং আইডি দিন (যেমন: TR-1001)" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <button onclick="trackParcel()" class="bg-blue-800 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-900 transition">ট্র্যাক</button>
                </div>
                <div id="trackingResult" class="hidden border-t pt-4">
                    <div class="bg-blue-50 p-4 rounded-lg mb-4">
                        <p class="text-sm text-gray-600">ট্র্যাকিং আইডি: <span id="resId" class="font-bold text-gray-800"></span></p>
                        <p class="text-sm text-gray-600">গ্রাহকের নাম: <span id="resCustomer" class="font-bold text-gray-800"></span></p>
                        <p class="text-sm text-gray-600">গন্তব্য: <span id="resAddress" class="font-bold text-gray-800"></span></p>
                    </div>
                    <div class="flex justify-between items-center my-6 relative">
                        <div class="w-full bg-gray-200 h-2 absolute top-1/2 -translate-y-1/2 z-0"></div>
                        <div id="statusProgress" class="bg-blue-600 h-2 absolute top-1/2 -translate-y-1/2 z-0 transition-all duration-500" style="width: 0%;"></div>
                        
                        <div class="z-10 bg-white p-2 text-center">
                            <div id="step1" class="w-8 h-8 rounded-full bg-gray-300 text-white flex items-center justify-center mx-auto mb-1"><i class="fa-solid fa-box"></i></div>
                            <span class="text-xs font-semibold">পিকআপড</span>
                        </div>
                        <div class="z-10 bg-white p-2 text-center">
                            <div id="step2" class="w-8 h-8 rounded-full bg-gray-300 text-white flex items-center justify-center mx-auto mb-1"><i class="fa-solid fa-warehouse"></i></div>
                            <span class="text-xs font-semibold">হাবে আছে</span>
                        </div>
                        <div class="z-10 bg-white p-2 text-center">
                            <div id="step3" class="w-8 h-8 rounded-full bg-gray-300 text-white flex items-center justify-center mx-auto mb-1"><i class="fa-solid fa-motorcycle"></i></div>
                            <span class="text-xs font-semibold">আউট ফর ডেলিভারি</span>
                        </div>
                        <div class="z-10 bg-white p-2 text-center">
                            <div id="step4" class="w-8 h-8 rounded-full bg-gray-300 text-white flex items-center justify-center mx-auto mb-1"><i class="fa-solid fa-check"></i></div>
                            <span class="text-xs font-semibold">ডেলিভারড</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. PRICE CALCULATOR SECTION -->
        <section id="calculator" class="tab-content">
            <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center"><i class="fa-solid fa-calculator text-blue-800 mr-2"></i>ডেলিভারি চার্জ ক্যালকুলেটর</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">এলাকা নিবরণ করুন</label>
                        <select id="calcArea" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600">
                            <option value="60">ঢাকার ভেতরে (Inside Dhaka) - ৳60</option>
                            <option value="100">ঢাকার বাইরে (Outside Dhaka) - ৳100</option>
                            <option value="120">সাব-আরবান (Suburban Area) - ৳120</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ওজন (কেজি)</label>
                        <input type="number" id="calcWeight" value="1" min="1" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600">
                    </div>
                    <button onclick="calculatePrice()" class="w-full bg-blue-800 text-white py-3 rounded-lg font-semibold hover:bg-blue-900">হিসাব করুন</button>
                    <div id="calcResult" class="mt-4 p-4 bg-green-50 text-green-800 rounded-lg text-center font-bold text-lg hidden"></div>
                </div>
            </div>
        </section>

        <!-- 3. PICKUP REQUEST SECTION -->
        <section id="pickup" class="tab-content">
            <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center"><i class="fa-solid fa-hand-holding-box text-blue-800 mr-2"></i>পিকআপ রিকুয়েস্ট ফর্ম</h2>
