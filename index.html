<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazari - আপনার সব প্রয়োজনের এক ঠিকানা</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; }

    /* Header & Navigation */
    header { background-color: #1a252f; color: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 28px; font-weight: bold; color: #2ecc71; text-decoration: none; }
    .search-box input { padding: 8px 12px; width: 250px; border: none; border-radius: 4px; outline: none; }
    .cart-btn { background: #2ecc71; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* Categories Bar */
    .categories-bar { background: #2c3e50; padding: 10px 5%; display: flex; gap: 10px; overflow-x: auto; }
    .cat-btn { background: transparent; color: #ecf0f1; border: 1px solid #34495e; padding: 6px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .cat-btn:hover, .cat-btn.active { background: #2ecc71; color: white; border-color: #2ecc71; }

    /* Main Products Section */
    .container { padding: 30px 5%; }
    .section-title { margin-bottom: 20px; font-size: 22px; color: #2c3e50; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    .product-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .product-img { width: 100%; height: 140px; background-color: #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #718096; margin-bottom: 12px; }
    .product-title { font-size: 16px; margin-bottom: 6px; font-weight: 600; }
    .product-category { font-size: 12px; color: #7f8c8d; text-transform: uppercase; margin-bottom: 10px; }
    .product-price { font-size: 18px; color: #e74c3c; font-weight: bold; margin-bottom: 12px; }
    .add-to-cart { background: #3498db; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .add-to-cart:hover { background: #2980b9; }

    /* Cart Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
    .checkout-btn { background: #2ecc71; color: white; width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; margin-top: 15px; cursor: pointer; }
    .close-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; float: right; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">Bazari</a>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="পণ্য খুঁজুন...">
    </div>
    <button class="cart-btn" onclick="toggleCart()">কার্ট (<span id="cartCount">0</span>)</button>
  </header>

  <!-- Category Nav -->
  <div class="categories-bar">
    <button class="cat-btn active" onclick="filterCategory('all')">সব পণ্য</button>
    <button class="cat-btn" onclick="filterCategory('grocery')">গ্রোসারি (Grocery)</button>
    <button class="cat-btn" onclick="filterCategory('electronics')">ইলেকট্রনিক্স</button>
    <button class="cat-btn" onclick="filterCategory('electrical')">ইলেকট্রিকেল</button>
    <button class="cat-btn" onclick="filterCategory('gadgets')">গ্যাজেটস</button>
    <button class="cat-btn" onclick="filterCategory('drugs')">ওষুধ (Drugs)</button>
  </div>

  <!-- Products Container -->
  <div class="container">
    <h2 class="section-title">পণ্য তালিকা</h2>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleCart()">X</button>
      <h2>আপনার শপিং কার্ট</h2>
      <div id="cartItems" style="margin-top: 15px;"></div>
      <h3 style="margin-top: 15px;">মোট: ৳<span id="cartTotal">0</span></h3>
      <button class="checkout-btn" onclick="alert('Bazari তে অর্ডার করার জন্য ধন্যবাদ! ব্যাকএন্ড কানেক্ট করলে অর্ডার সাবমিট হবে।')">অর্ডার সম্পন্ন করুন</button>
    </div>
  </div>

  <script>
    // Sample Data
    const products = [
      { id: 1, name: 'মিনিকেট চাল (৫ কেজি)', category: 'grocery', price: 350 },
      { id: 2, name: 'স্মার্ট টিভি ৪৩ ইঞ্চি', category: 'electronics', price: 32000 },
      { id: 3, name: 'এলইডি বাল্ব ১২ ওয়াট', category: 'electrical', price: 150 },
      { id: 4, name: 'ওয়্যারলেস ইয়ারবাডস', category: 'gadgets', price: 1200 },
      { id: 5, name: 'প্যারাসিটামল ৫০০ মিগ্রা', category: 'drugs', price: 15 },
      { id: 6, name: 'সোয়াবিন তেল (২ লিটার)', category: 'grocery', price: 330 },
      { id: 7, name: 'স্মার্টওয়াচ Series 8', category: 'gadgets', price: 2500 },
      { id: 8, name: 'মুলটিপ্লাগ ৫ পোর্ট', category: 'electrical', price: 450 }
    ];

    let cart = [];

    // Render Products
    function displayProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = items.map(p => `
        <div class="product-card">
          <div class="product-img">${p.category}</div>
          <div class="product-title">${p.name}</div>
          <div class="product-category">${p.category}</div>
          <div class="product-price">৳${p.price}</div>
          <button class="add-to-cart" onclick="addToCart(${p.id})">কার্টে রাখুন</button>
        </div>
      `).join('');
    }

    // Filter by Category
    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      if (cat === 'all') {
        displayProducts(products);
      } else {
        const filtered = products.filter(p => p.category === cat);
        displayProducts(filtered);
      }
    }

    // Search Filter
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      displayProducts(filtered);
    }

    // Cart Handlers
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cartCount').innerText = cart.length;
      const cartItemsDiv = document.getElementById('cartItems');
      cartItemsDiv.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>৳${item.price}</span>
        </div>
      `).join('');
      
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cartTotal').innerText = total;
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // Initial Load
    displayProducts(products);
  </script>
</body>
</html>
