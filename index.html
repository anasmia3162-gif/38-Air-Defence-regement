<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .banner-slide { display: none; }
        .banner-slide.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('user')">
                <i class="fa-solid fa-shop text-2xl"></i>
                <span class="font-bold text-xl tracking-wide">MyECom Store</span>
            </div>
            
            <div class="flex items-center space-x-6">
                <!-- User Nav Links -->
                <div id="user-nav" class="flex items-center space-x-4">
                    <button onclick="switchTab('home')" class="hover:text-gray-200">হোম</button>
                    <button onclick="switchTab('track')" class="hover:text-gray-200">অর্ডার ট্র্যাক</button>
                    <button onclick="openCart()" class="relative hover:text-gray-200">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-xs px-1.5 py-0.5 rounded-full">0</span>
                    </button>
                    <button onclick="openAdminLoginModal()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded text-sm font-medium transition">
                        <i class="fa-solid fa-lock mr-1"></i> এডমিন
                    </button>
                </div>

                <!-- Admin Nav Links (Hidden by default) -->
                <div id="admin-nav" class="hidden flex items-center space-x-4">
                    <span class="bg-indigo-800 text-xs px-2 py-1 rounded">এডমিন মোড</span>
                    <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm transition">লগআউট</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- USER VIEW CONTAINER                        -->
    <!-- ========================================== -->
