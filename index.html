<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Order Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-admin { background-color: #e0e0e0; color: #333; }
    .btn-user { background-color: #d1e7dd; color: #0f5132; }
    .btn-logout { background-color: #dc3545; color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
      color: #555;
    }
    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      outline: none;
    }
    .status-text {
      font-weight: bold;
    }
    .status-delivered { color: #0d6efd; }
    .status-cancelled { color: #dc3545; }
    .status-transit { color: #fd7e14; }
    .status-placed { color: #6c757d; }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Navigation -->
  <div class="header">
    <button class="btn btn-admin">Admin Mode</button>
    <button class="btn btn-user">User Site</button>
    <button class="btn btn-logout">Logout</button>
  </div>

  <!-- Order Table -->
  <table>
    <thead>
      <tr>
        <th>Items</th>
        <th>Total Amount</th>
        <th>Date</th>
        <th>Parcel Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Wireless Headphones (x1)</td>
        <td>৳1320</td>
        <td>08/10/2026</td>
        <td>
          <select id="statusSelect" onchange="updateActionStatus(this.value)">
            <option value="Order Placed">Order Placed</option>
            <option value="In Transit">In Transit</option>
            <option value="Out for Delivery (Shipped)">Out for Delivery (Shipped)</option>
            <option value="Delivered" selected>Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </td>
        <td>
          <span id="actionStatus" class="status-text status-delivered">Delivered</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  function updateActionStatus(status) {
    const actionElement = document.getElementById('actionStatus');
    actionElement.innerText = status;

    // Reset classes
    actionElement.className = 'status-text';

    // Apply color based on status
    if (status === 'Delivered') {
      actionElement.classList.add('status-delivered');
    } else if (status === 'Cancelled') {
      actionElement.classList.add('status-cancelled');
    } else if (status === 'In Transit' || status === 'Out for Delivery (Shipped)') {
      actionElement.classList.add('status-transit');
    } else {
      actionElement.classList.add('status-placed');
    }
  }
</script>

</body>
</html>
