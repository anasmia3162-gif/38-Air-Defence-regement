<script>
  // ১. LocalStorage Key Names
  const PRODUCTS_KEY = 'bazari_products';
  const ORDERS_KEY = 'bazari_orders';

  // ডিফোল্ট প্রোডাক্ট ডাটা (প্রথমবার লোকালস্টোরেজে কিছু না থাকলে এটি লোড হবে)
  const defaultProducts = [
    {
      id: 1,
      name: "Wireless Headphones",
      category: "Electronics",
      originalPrice: 1200,
      discountPercent: 10,
      stock: 14,
      image: "https://via.placeholder.com/50"
    }
  ];

  // ডিফোল্ট অর্ডার ডাটা
  const defaultOrders = [
    {
      id: "actionStatus1",
      items: "Wireless Headphones (x1)",
      amount: "৳1320",
      date: "08/10/2026",
      status: "Delivered"
    }
  ];

  // ২. Admin Access Control Logic
  function checkAdminAccess() {
    const isAdmin = window.location.hash === '#admin';
    const adminControls = document.getElementById('adminControls');
    const adminSection = document.getElementById('adminSection');
    const adminCols = document.querySelectorAll('.admin-only-col');

    if (isAdmin) {
      adminControls.classList.add('show');
      adminSection.classList.add('show');
      adminCols.forEach(col => col.style.display = 'table-cell');
    } else {
      adminControls.classList.remove('show');
      adminSection.classList.remove('show');
      adminCols.forEach(col => col.style.display = 'none');
    }
  }

  function switchMode(mode) {
    if (mode === 'admin') {
      window.location.hash = 'admin';
    } else {
      window.location.hash = '';
    }
  }

  window.addEventListener('load', () => {
    checkAdminAccess();
    renderProducts();
    renderOrders();
  });
  window.addEventListener('hashchange', checkAdminAccess);

  // Ctrl + Shift + A Shortcut
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
      e.preventDefault();
      window.location.hash = (window.location.hash === '#admin') ? '' : 'admin';
    }
  });

  // ৩. Order Management (LocalStorage Integration)
  function getOrders() {
    const saved = localStorage.getItem(ORDERS_KEY);
    return saved ? JSON.parse(saved) : defaultOrders;
  }

  function saveOrders(orders) {
    localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
  }

  function renderOrders() {
    const orders = getOrders();
    const tbody = document.querySelector('table:nth-of-type(1) tbody');
    tbody.innerHTML = '';

    orders.forEach(order => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${order.items}</td>
        <td>${order.amount}</td>
        <td>${order.date}</td>
        <td>
          <select class="status-select" onchange="updateOrderStatus('${order.id}', this.value)">
            <option value="Order Placed" ${order.status === 'Order Placed' ? 'selected' : ''}>Order Placed</option>
            <option value="In Transit" ${order.status === 'In Transit' ? 'selected' : ''}>In Transit</option>
            <option value="Out for Delivery (Shipped)" ${order.status === 'Out for Delivery (Shipped)' ? 'selected' : ''}>Out for Delivery (Shipped)</option>
            <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
          </select>
        </td>
        <td>
          <span id="${order.id}" class="status-text ${getStatusClass(order.status)}">${order.status}</span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function updateOrderStatus(orderId, newStatus) {
    const orders = getOrders();
    const orderIndex = orders.findIndex(o => o.id === orderId);
    
    if (orderIndex !== -1) {
      orders[orderIndex].status = newStatus;
      saveOrders(orders);
    }

    const actionElement = document.getElementById(orderId);
    if (actionElement) {
      actionElement.innerText = newStatus;
      actionElement.className = `status-text ${getStatusClass(newStatus)}`;
    }
  }

  function getStatusClass(status) {
    if (status === 'Delivered') return 'status-delivered';
    if (status === 'Cancelled') return 'status-cancelled';
    if (status === 'In Transit' || status === 'Out for Delivery (Shipped)') return 'status-transit';
    return 'status-placed';
  }

  // ৪. Product Management (LocalStorage Integration)
  function getProducts() {
    const saved = localStorage.getItem(PRODUCTS_KEY);
    return saved ? JSON.parse(saved) : defaultProducts;
  }

  function saveProducts(products) {
    localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
  }

  function renderProducts() {
    const products = getProducts();
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = '';

    products.forEach(product => {
      let priceHTML = '';
      if (product.discountPercent > 0) {
        const discountedPrice = product.originalPrice - (product.originalPrice * (product.discountPercent / 100));
        priceHTML = `
          <span class="original-price">৳${product.originalPrice}</span>
          <span class="discount-price">৳${Math.round(discountedPrice)}</span>
          <span class="badge-discount">-${product.discountPercent}%</span>
        `;
      } else {
        priceHTML = `<span class="discount-price">৳${product.originalPrice}</span>`;
      }

      const newRow = document.createElement('tr');
      newRow.innerHTML = `
        <td><img src="${product.image}" class="product-img" alt="${product.name}"></td>
        <td>${product.name}</td>
        <td>${product.category}</td>
        <td>${priceHTML}</td>
        <td>${product.stock}</td>
        <td class="admin-only-col"><button class="btn-delete" onclick="deleteProduct(${product.id})">🗑️</button></td>
      `;
      tbody.appendChild(newRow);
    });

    checkAdminAccess();
  }

  // নতুন প্রোডাক্ট যোগ করা
  document.getElementById('addProductForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('prodName').value;
    const originalPrice = parseFloat(document.getElementById('prodPrice').value);
    const discountPercent = parseFloat(document.getElementById('prodDiscount').value) || 0;
    const stock = document.getElementById('prodStock').value;
    const category = document.getElementById('prodCategory').value;
    const imageInput = document.getElementById('prodImage');

    if (imageInput.files && imageInput.files[0]) {
      const reader = new FileReader();

      reader.onload = function(e) {
        const imageBase64 = e.target.result;

        const products = getProducts();
        const newProduct = {
          id: Date.now(), // ইউনিক আইডি
          name: name,
          category: category,
          originalPrice: originalPrice,
          discountPercent: discountPercent,
          stock: stock,
          image: imageBase64
        };

        products.push(newProduct);
        saveProducts(products);
        renderProducts();

        document.getElementById('addProductForm').reset();
      };

      reader.readAsDataURL(imageInput.files[0]); // Base64 স্ট্রিং কনভার্ট
    }
  });

  // প্রোডাক্ট ডিলিট করা
  function deleteProduct(productId) {
    let products = getProducts();
    products = products.filter(p => p.id !== productId);
    saveProducts(products);
    renderProducts();
  }
</script>
