<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>৩৮ এয়ার ডিফেন্স রেজিমেন্ট - সদস্য ব্যবস্থাপনা</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .card { background: #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h2, h3 { color: #38bdf8; text-align: center; margin-top: 0; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 14px; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 5px; color: #fff; font-size: 14px; }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        
        .btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #059669; }
        
        /* টেবিল স্টাইল */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #0f172a; color: #38bdf8; }
        .member-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>+ নতুন সদস্য যুক্ত করুন</h2>
        <form id="memberForm" onsubmit="addMember(event)">
            <div class="form-grid">
                <!-- ১. ছবি -->
                <div class="form-group full-width">
                    <label>প্রোফাইল ছবি:</label>
                    <input type="file" id="memberPhoto" accept="image/*" onchange="previewImage(event)" required>
                </div>

                <!-- মূল তথ্য -->
                <div class="form-group">
                    <label>সেনা নম্বর (Army No):</label>
                    <input type="text" id="armyNo" placeholder="যেমন: BA-10234" required>
                </div>
                <div class="form-group">
                    <label>নাম:</label>
                    <input type="text" id="memberName" placeholder="সদস্যের নাম" required>
                </div>

                <!-- ২. ক্যাটাগরি ড্রপডাউন -->
                <div class="form-group">
                    <label>ক্যাটাগরি:</label>
                    <select id="category" onchange="updateDropdowns()" required>
                        <option value="">-- নির্বাচন করুন --</option>
                        <option value="officer">অফিসার</option>
                        <option value="jco">জেসিও</option>
                        <option value="others">অন্যান্য</option>
                    </select>
                </div>

                <!-- ৩. র‍্যাঙ্ক ড্রপডাউন (ডায়নামিক) -->
                <div class="form-group">
                    <label>র‍্যাঙ্ক:</label>
                    <select id="rank" required disabled>
                        <option value="">-- আগে ক্যাটাগরি নির্বাচন করুন --</option>
                    </select>
                </div>

                <!-- পেশা ড্রপডাউন (ডায়নামিক) -->
                <div class="form-group full-width" id="tradeGroup">
                    <label>পেশা (Trade):</label>
                    <select id="trade" disabled>
                        <option value="">-- প্রযোজ্য নয় --</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn" style="margin-top: 15px;">সদস্য সেভ করুন</button>
        </form>
    </div>

    <!-- সদস্যদের তালিকা -->
    <div class="card">
        <h3>রেজিমেন্ট সদস্য তালিকা</h3>
        <table id="memberTable">
            <thead>
                <tr>
                    <th>ক্রমিক নং</th>
                    <th>ছবি</th>
                    <th>সেনা নম্বর</th>
                    <th>নাম</th>
                    <th>ক্যাটাগরি</th>
                    <th>র‍্যাঙ্ক</th>
                    <th>পেশা</th>
                </tr>
            </thead>
            <tbody id="memberTableBody">
                <!-- ডাটা ডায়নামিকভাবে আসবে -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // র‍্যাঙ্ক এবং পেশার ডাটা সেট
    const optionsData = {
        officer: {
            ranks: ['লেফটেন্যান্ট', 'ক্যাপ্টেন', 'মেজর', 'লেঃ কর্নেল'],
            trades: [] // অফিসারদের পেশা ড্রপডাউন নেই
        },
        jco: {
            ranks: ['আরসিও', 'ওয়াঃ অফিঃ', 'সিনিঃ ওয়াঃ অফিঃ', 'মাস্টার ওয়াঃ অফিঃ', 'অনারারি লেঃ', 'অনারারি ক্যাপ্টেন'],
            trades: ['ওপি আর', 'ওসিইউ', 'ডিএমটি', 'গানার', 'করণিক', 'কুক']
        },
        others: {
            ranks: ['সৈনিক', 'ল্যাঃ কর্পোরাল', 'কর্পোরাল', 'সার্জেন্ট'],
            trades: ['ওপি আর', 'ওসিইউ', 'ডিএমটি', 'গানার', 'করণিক', 'কুক ইউ', 'কুক মেস', 'এনসি ইউ', 'এনসি মেস', 'মেস ওয়েটার', 'মসালচি']
        }
    };

    let selectedPhotoBase64 = "";
    let memberList = [];

    // ছবি প্রিভিউ
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedPhotoBase64 = e.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // ক্যাটাগরি অনুযায়ী র‍্যাঙ্ক ও পেশার ড্রপডাউন আপডেট করার ফাংশন
    function updateDropdowns() {
        const category = document.getElementById('category').value;
        const rankSelect = document.getElementById('rank');
        const tradeSelect = document.getElementById('trade');

        rankSelect.innerHTML = '<option value="">-- র‍্যাঙ্ক নির্বাচন করুন --</option>';
        tradeSelect.innerHTML = '<option value="">-- পেশা নির্বাচন করুন --</option>';

        if (category && optionsData[category]) {
            // র‍্যাঙ্ক পপুলেট
            rankSelect.disabled = false;
            optionsData[category].ranks.forEach(rank => {
                rankSelect.innerHTML += `<option value="${rank}">${rank}</option>`;
            });

            // পেশা পপুলেট (যদি থাকে)
            if (optionsData[category].trades.length > 0) {
                tradeSelect.disabled = false;
                optionsData[category].trades.forEach(trade => {
                    tradeSelect.innerHTML += `<option value="${trade}">${trade}</option>`;
                });
            } else {
                tradeSelect.disabled = true;
                tradeSelect.innerHTML = '<option value="-">প্রযোজ্য নয়</option>';
            }
        } else {
            rankSelect.disabled = true;
            tradeSelect.disabled = true;
        }
    }

    // নতুন সদস্য যুক্ত করা
    function addMember(e) {
        e.preventDefault();

        const member = {
            armyNo: document.getElementById('armyNo').value,
            name: document.getElementById('memberName').value,
            category: document.getElementById('category').options[document.getElementById('category').selectedIndex].text,
            rank: document.getElementById('rank').value,
            trade: document.getElementById('trade').value || '-',
            photo: selectedPhotoBase64 || 'https://via.placeholder.com/45'
        };

        memberList.push(member);
        renderTable();

        // ফর্ম রিসেট
        document.getElementById('memberForm').reset();
        document.getElementById('rank').disabled = true;
        document.getElementById('trade').disabled = true;
        selectedPhotoBase64 = "";
    }

    // টেবিল রেন্ডার এবং ক্রমিক নম্বর দেওয়া
    function renderTable() {
        const tableBody = document.getElementById('memberTableBody');
        tableBody.innerHTML = "";

        memberList.forEach((member, index) => {
            const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td><img src="${member.photo}" class="member-img" alt="Photo"></td>
                    <td>${member.armyNo}</td>
                    <td>${member.name}</td>
                    <td>${member.category}</td>
                    <td>${member.rank}</td>
                    <td>${member.trade}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }
</script>

</body>
</html>
